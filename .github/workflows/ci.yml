name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + unit + integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # contracts module generates gRPC stubs (.proto) and JAXB classes (.xsd); verify runs every test.
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, report-service, collection-service, municipal-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: error

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  contracts-lint:
    name: Contracts well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - run: xmllint --noout contracts/src/main/resources/municipal.xsd contracts/wsdl/municipal.wsdl
      - run: python3 -c "import yaml,sys; yaml.safe_load(open('contracts/openapi/report-service.yaml'))"
      - run: docker compose config -q
        env:
          REPORTS_DB_PASSWORD: x
          COLLECTIONS_DB_PASSWORD: x
          MUNICIPAL_DB_PASSWORD: x
          POSTGRES_PASSWORD: x

  e2e:
    name: Compose end-to-end (smoke + failure recovery)
    runs-on: ubuntu-latest
    needs: [build-and-test, dockerfile-lint, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && echo "SIMULATION_STEP_SECONDS=3" >> .env
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: bash scripts/smoke-test.sh
      - run: bash scripts/failure-demo.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
