server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API (including the Server-Sent Events stream) goes to the gateway through Docker DNS.
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;          # lets SSE events through immediately
    proxy_read_timeout 1h;
    client_max_body_size 6m;      # photo upload
  }

  # Single-page app: unknown paths serve index.html
  location / {
    try_files $uri /index.html;
  }
}
